<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spinel IDE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Spinel's whole-program type inference at a cursor: hover for the inferred type, markers for refusals and slow paths, the RBS it settled on, the C it emits.">
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #636c76; --line: #d0d7de; --panel: #f6f8fa;
    --accent: #0969da; --err: #cf222e; --warn: #9a6700; --ok: #1a7f37;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --line: #30363d; --panel: #161b22;
      --accent: #58a6ff; --err: #ff7b72; --warn: #d29922; --ok: #3fb950;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --line: #30363d; --panel: #161b22;
    --accent: #58a6ff; --err: #ff7b72; --warn: #d29922; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header h1 a { color: inherit; text-decoration: none; }
  header select, header button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
  header button { cursor: pointer; }
  header button:disabled { opacity: .5; cursor: default; }
  header button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  #status { color: var(--muted); font-size: 13px; margin-left: auto; }
  #counts b { font-weight: 600; }
  #counts .err { color: var(--err); } #counts .warn { color: var(--warn); } #counts .ok { color: var(--ok); }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  #editor { min-height: 0; border-right: 1px solid var(--line); }
  #editor textarea { width: 100%; height: 100%; border: 0; resize: none; font: 13px/1.5 var(--mono); padding: 8px; background: var(--bg); color: var(--fg); }
  aside { display: flex; flex-direction: column; min-height: 0; }
  nav.tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
  nav.tabs button { font: inherit; background: transparent; color: var(--muted); border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; padding: 5px 12px; cursor: pointer; }
  nav.tabs button[aria-selected="true"] { color: var(--fg); background: var(--bg); border-color: var(--line); }
  .pane { flex: 1; min-height: 0; display: none; }
  .pane[data-active] { display: block; }
  .pane pre { margin: 0; height: 100%; overflow: auto; font: 12.5px/1.5 var(--mono); padding: 10px 14px; white-space: pre-wrap; }
  #diagnostics ul { list-style: none; margin: 0; padding: 8px 0; overflow: auto; height: 100%; }
  #diagnostics li { padding: 6px 14px; border-bottom: 1px solid var(--line); cursor: pointer; font-family: var(--mono); font-size: 12.5px; }
  #diagnostics li.error { border-left: 3px solid var(--err); } #diagnostics li.warning { border-left: 3px solid var(--warn); }
  #diagnostics .where { color: var(--muted); }
  #diagnostics ul.why { padding: 2px 0 2px 18px; height: auto; overflow: visible; font-size: 12px; }
  #diagnostics ul.why li { padding: 1px 0; border: 0; cursor: default; }
  #diagnostics .empty { color: var(--muted); padding: 14px; font-family: var(--font); }
  #output pre { color: var(--fg); }
  .sp-boxed { text-decoration: underline wavy var(--err); text-underline-offset: 3px; }
  .sp-switch { text-decoration: underline dotted var(--warn); text-underline-offset: 3px; }
  #codegen ul { list-style: none; margin: 0; padding: 8px 0; overflow: auto; height: 100%; }
  #codegen li { padding: 5px 14px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; }
  #codegen li.boxed { border-left: 3px solid var(--err); } #codegen li.switch { border-left: 3px solid var(--warn); } #codegen li.fn { border-left: 3px solid var(--muted); }
  #codegen .where { color: var(--muted); }
  #codegen .legend, #codegen .empty { color: var(--muted); padding: 10px 14px; font-family: var(--font); border-bottom: 1px solid var(--line); }
  #output .rc { color: var(--muted); }
  footer { padding: 6px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; display: flex; gap: 16px; flex-wrap: wrap; }
  footer a { color: var(--accent); }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    #editor { border-right: 0; border-bottom: 1px solid var(--line); }
    header { padding: 8px 16px; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="../">Spinel IDE</a></h1>
  <select id="sample" aria-label="sample program"></select>
  <button id="btnAnalyze" title="re-run the analysis now (it also runs on every edit)">Analyze</button>
  <button id="btnRun" class="primary" title="run the program">Run</button>
  <span id="status">loading compiler…</span>
</header>
<main>
  <div id="editor"></div>
  <aside>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="rbs" aria-selected="true">Signatures</button>
      <button role="tab" data-tab="diagnostics">Diagnostics <span id="counts"></span></button>
      <button role="tab" data-tab="codegen">Codegen <span id="cgcounts"></span></button>
      <button role="tab" data-tab="c">Emitted C</button>
      <button role="tab" data-tab="output">Output</button>
    </nav>
    <section class="pane" id="rbs" data-active></section>
    <section class="pane" id="diagnostics"><ul></ul></section>
    <section class="pane" id="codegen"><ul></ul></section>
    <section class="pane" id="c"></section>
    <section class="pane" id="output"><pre id="outputText"></pre></section>
  </aside>
</main>
<footer>
  <span id="version">spinel</span>
  <span>The compiler runs here as wasm32, so it infers and emits for a 32-bit <code>Integer</code> (a literal past 2**31 is a Bignum), as the Run build is. <a href="https://github.com/matz/spinel/blob/master/docs/wasm.md">docs/wasm.md</a></span>
  <span><a href="https://github.com/rubys/spinel-ide">source</a> · <a href="https://github.com/matz/spinel">spinel</a></span>
</footer>
<script type="module" src="./ide.js"></script>
</body>
</html>
